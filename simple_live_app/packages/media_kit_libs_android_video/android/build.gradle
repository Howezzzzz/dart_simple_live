import java.io.File
import java.net.HttpURLConnection
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            // 自建构建：在 Predidit/libmpv-android-video-build@dd2bfba 基础上启用 loudnorm 滤镜
            // （构建编排见 .github/workflows/build-libmpv-android-custom.yml，产物 tag libmpv-android-custom-v1）
            // SHA-256 已回填自该 release（2026-10-08）
            ["url": "https://github.com/Howezzzzz/dart_simple_live/releases/download/libmpv-android-custom-v1/default-arm64-v8a.jar", "sha256": "53d409a4089780dca560d10644fa84cd04db159e5c5ba4e0ff5987f026da73e3", "destination": file("$buildDir/custom/default-arm64-v8a.jar")],
            ["url": "https://github.com/Howezzzzz/dart_simple_live/releases/download/libmpv-android-custom-v1/default-armeabi-v7a.jar", "sha256": "1b14a6a1706c3ccd84e4da5705c6c9a159fa3936677c9839a2c5e05bbe9d0a3c", "destination": file("$buildDir/custom/default-armeabi-v7a.jar")],
            ["url": "https://github.com/Howezzzzz/dart_simple_live/releases/download/libmpv-android-custom-v1/default-x86_64.jar", "sha256": "218f84bd258d06f70d3070765787392fcc383bc1e1d7815df0c8ca839efd23f9", "destination": file("$buildDir/custom/default-x86_64.jar")],
            ["url": "https://github.com/Howezzzzz/dart_simple_live/releases/download/libmpv-android-custom-v1/default-x86.jar", "sha256": "379c2dfe2551d0b5cfaa73ec20615beef2233920a5f6987e1d276d8d84c84f6b", "destination": file("$buildDir/custom/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                // ISS-009：显式连接/读取超时，避免无超时下载挂死；跟随重定向
                def conn = (HttpURLConnection) new URL(fileInfo.url).openConnection()
                conn.connectTimeout = 30000
                conn.readTimeout = 600000
                conn.instanceFollowRedirects = true
                try {
                    destFile.withOutputStream { os ->
                        os << conn.inputStream
                    }
                } finally {
                    conn.disconnect()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)
