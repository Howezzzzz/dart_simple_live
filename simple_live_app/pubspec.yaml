name: simple_live_app
version: 1.08.39+10839
publish_to: none
description: "Slive APP"
environment: 
  sdk: '>=3.12.0 <4.0.0'   # 2026-10-22 插件现代化：wakelock_plus 1.8.1 要求 Dart >=3.12（原 >=3.0.5 已失真，同步为真实底线）
  flutter: 3.47.8

dependencies: 
  flutter: 
    sdk: flutter
  flutter_localizations: 
    sdk: flutter

  simple_live_core:
    path: ../simple_live_core
  # 图标
  cupertino_icons: ^1.0.9
  remixicon: ^4.9.3 # Remix 图标

  # 框架、工具
  archive: ^4.3.0 # 文件压缩
  get: ^4.7.3 # 状态管理、路由管理、国际化
  dio: ^5.11.0 # 网络请求
  hive_ce: ^2.19.3 # 持久化存储
  hive_ce_flutter: ^2.3.4 # 持久化存储
  logger: ^2.8.0 # 日志
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7 # firebase
  firebase_core: ^4.13.0
  intl: ^0.20.2 # 国际化
  pinyin: ^3.3.0
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  qr_flutter: ^4.1.0 # 二维码生成
  dynamic_color: ^2.1.0 # 动态颜色
  path: any
  udp: ^5.0.3 # UDP
  fractional_indexing_dart: ^1.0.7 #分数索引
  synchronized: ^3.4.0 # 线程安全
  collection: ^1.19.1
  pool: ^1.5.3 #并发控制器
  material_ui: any
  cupertino_ui: any
  uuid: any

  # ffi
  ffi: ^2.2.0 # ShellExecuteW 拉起安装程序（Windows 前台 + UAC 兼容）
  rust_lib_simple_live_app:
    path: rust_builder
  flutter_rust_bridge: ^2.13.0

  # Widget
  flutter_staggered_grid_view: ^0.7.0 # 瀑布流 / GridView
  easy_refresh: ^3.5.1 # 下拉刷新、上拉加载
  extended_image: ^10.1.0 # 拓展 Image ，支持缓存
  flutter_smart_dialog: ^5.3.0 # 各种弹窗 Toast / Dialog / Popup
  sticky_headers: ^0.3.0+2 # 吸顶
  lottie: ^3.3.2 # Lottie 动画
  canvas_danmaku: ^0.3.1 # 弹幕库

  # 系统交互
  package_info_plus: ^10.0.0 # 包信息（2026-10-22 插件现代化：8→10，win32 6 波）
  device_info_plus: ^13.0.0 # 设备信息（12→13）
  url_launcher: ^6.3.2 # 打开链接
  open_filex: ^5.0.0 # 打开下载好的安装包（拉起系统安装器）
  crypto: ^3.0.7 # 下载后校验安装包 sha256（防第三方镜像换包）
  share_plus: ^13.0.0 # 分享（12→13）
  path_provider: ^2.1.6 # 常用路径
  cross_file: ^0.3.5+4 # 跨平台文件
  # permission_handler: ^12.0.1 # 权限处理
  permission_handler_apple: ^9.5.0
  permission_handler_android: ^14.0.0
  permission_handler_platform_interface: ^4.4.0
  flutter_image_gallery_saver: ^2.0.0 # 图片保存到相册
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0 #亮度控制
  auto_orientation_v2: 2.3.8 # 屏幕方向
  wakelock_plus: ^1.3.3 # 屏幕常亮
  file_picker: ^13.1.0 # 文件选择（11→13，API 有变更已适配）
  window_manager: ^0.5.0 # 窗口管理
  floating: ^6.0.0 # PIP 画中画
  flutter_inappwebview:
    git:
      url: https://github.com/guide-inc-org/guide-flutter_inappwebview.git
      path: flutter_inappwebview
      ref: sbi_fx_pc/v6.2.0-beta.3
  connectivity_plus: ^7.0.0 # 网络状态
  qr_code_scanner_plus: ^2.0.14 # 二维码扫描
  flutter_secure_storage: ^11.2.0 # 密钥存储

  # 网络相关
  webdav_client: ^1.2.2 # WebDAV
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  network_info_plus: ^8.0.0 # 局域网信息（7→8）
  signalr_netcore: ^1.4.4 # SignalR

  # 视频播放
  volume_controller: any
  # media_kit / media_kit_video：**2026-10-22 起两者均内嵌本仓库副本**（方案 A：斩断外部 git 依赖）
  # ——上游 SlotSun/media-kit 有 force-push 改写历史的前科（`b2bb9ff0` 被冲掉 → Linux runner 新克隆拉不到、CI 挂），
  #   内嵌后上游怎么改都不影响构建；`media_kit_video` 内部 `media_kit: path: ../media_kit` 自然指向本仓库副本。
  # 内嵌副本快照自上游 `SlotSun/media-kit@ccd38d67`（2026-10-22，逐字节核验一致，仅去掉 melos 的 pubspec_overrides.yaml）。
  # 自有定制保留在 packages/media_kit/hook/native_bundles.json：Android×4 + Windows x64 指向自建含 loudnorm 的 libmpv（音量均衡）。
  # 上游更新时的同步流程：文档/上游同步-media_kit_video.md（脚本 脚本/同步/sync_media_kit_video.sh）。
  media_kit:
    path: packages/media_kit
  media_kit_video:
    path: packages/media_kit_video

dependency_overrides:
  get:
    git:
      url: https://github.com/SlotSun/get.git
      # 钉固定 commit（get 4.7.3）而非 master：避免锁文件不可重现/构建非确定（ISS-016）
      ref: f0ddb3514c96dde2816495e3461d1c3b8456de3c
  # 强制 media_kit 用本仓库内嵌副本（media_kit_video 内部引用 ../media_kit）
  media_kit:
    path: packages/media_kit

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  hive_ce_generator: ^1.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_test: 
    sdk: flutter
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter: 
  fonts:
    - family: iconfont
      fonts:
        - asset: assets/iconfont/live_icons.ttf
  uses-material-design: true
  assets:
    - assets/statement.txt
    - assets/images/
    - assets/icons/
    - assets/lotties/
    - assets/fonts/fonts-manifest.json
    - shorebird.yaml
