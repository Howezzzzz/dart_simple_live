name: test

# 测试门禁：pull_request / 手动触发跑 `flutter test`。
# 说明：本地沙箱因内嵌 media_kit 的 native-assets 需要 clang/vswhere 而无法跑 test，
#       故由 CI 兜底执行完整测试套件。push 到 master 不自动跑（避免每次同步都长跑），
#       需要时用 workflow_dispatch 触发。

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      - name: pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: flutter test
        working-directory: simple_live_app
        run: flutter test --concurrency=1
