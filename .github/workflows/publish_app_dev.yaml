name: app-build-action-dev

on:
  # 只手动触发：本仓只有 master，构建一律走 workflow_dispatch。
  # 原 `push: dev` 触发与全程 checkout master 不一致，且本仓无 dev 分支 → 永不触发，已移除。
  workflow_dispatch:
# If previous workflow is still running, we push again, we will cancel the previous workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:

  # 发版门禁（2026-10-20 · ISS-154）：原 build 流水线**不跑 tests**，导致「测试红灯也能发 Release」
  # （v1.8.22 即如此：test job 挂了、Release 照发）。这里先跑 analyze(error 级) + 单测；
  # 不过就不进 prepare → 不出包、不发布。口径与 check.yml / test.yml 保持一致。
  test-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      - name: pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: analyze（error 级硬门禁）
        working-directory: simple_live_app
        run: |
          flutter analyze lib test tool > /tmp/an.txt 2>&1 || true
          tail -6 /tmp/an.txt
          if ! grep -qE 'issues? found|No issues found' /tmp/an.txt; then
            echo "::error::analyze 未产出结果（疑分析器崩溃/超时）——门禁视为失败"
            tail -20 /tmp/an.txt
            exit 1
          fi
          if grep -qE '^[[:space:]]*error[[:space:]]*[•-]' /tmp/an.txt; then
            echo "::error::analyze 存在 error —— 门禁未通过"
            grep -nE '^[[:space:]]*error[[:space:]]*[•-]' /tmp/an.txt
            exit 1
          fi

      - name: flutter test（发版前必须全绿）
        working-directory: simple_live_app
        run: flutter test --concurrency=1

  # 版本号管理：每次构建 patch +1（到 100 进位 minor）；只回写 pubspec 到 master。
  # app_version.json 改由 release job 在 Release 建成后写（避免先宣告一个不存在的 Release）
  prepare:
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      version_num: ${{ steps.bump.outputs.version_num }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Bump version (patch +1; roll over to next minor at 100)
        id: bump
        run: |
          set -euo pipefail
          OLD="$(sed -n 's/^version:[[:space:]]*//p' simple_live_app/pubspec.yaml | head -1)"
          BASE="${OLD%%+*}"
          IFS='.' read -r MA MI PA <<< "$BASE"
          MA=$((10#$MA)); MI=$((10#$MI)); PA=$((10#$PA + 1))
          # patch ≥100 会让 version_num 公式(major*10000+minor*100+patch) 与 app 端
          # parseVersion(逐段补零拼接) 分叉 —— 到 100 时进位到下一 minor、patch 归 0
          if [ "$PA" -ge 100 ]; then
            MI=$((MI + 1)); PA=0
          fi
          # 2026-10-20 Howe 定：minor/patch 恒两位（段内 9→10 不进位跨点；进位归零补零）。
          # 例：1.8.24 → 1.08.25；1.9.99 → 1.10.00（major 不补零，与 app 端 formatVersion 一致）
          NEW="$(printf '%s.%02d.%02d' "$MA" "$MI" "$PA")"
          NUM=$((MA*10000 + MI*100 + PA))
          echo "version: $OLD -> $NEW+$NUM"
          sed -i "s/^version: .*/version: $NEW+$NUM/" simple_live_app/pubspec.yaml
          git config user.name "slive-bot"
          git config user.email "slive-bot@users.noreply.github.com"
          git add simple_live_app/pubspec.yaml
          git commit -m "chore(version): $NEW+$NUM [skip ci]"
          # push 竞态防护：master 若在构建期间被推进，rebase 后重试，避免 non-FF 直接失败
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::prepare push 失败（master 并发冲突）"; exit 1; }
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "version_num=$NUM" >> "$GITHUB_OUTPUT"

  # packing android on ubuntu, macos slowly
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: prepare

    steps:
      # 签出代码
      - uses: actions/checkout@v7
        with:
          ref: master

      # APK 签名设置
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "${{ secrets.FIREBASE_JSON }}" | base64 --decode > simple_live_app/android/app/google-services.json
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode > simple_live_app/lib/firebase_options.dart
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 设置 JAVA 环境
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            simple_live_app/android/*.gradle*
            simple_live_app/android/**/gradle-wrapper.properties

      # 设置 Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true

      # 更新 Flutter 的 packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 打包 APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 上传 Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
      

  # 打包iOS、Mac
  build-mac-ios:
    runs-on: macos-latest
    needs: prepare

    permissions:
      contents: write

    steps:
      # 签出代码
      - uses: actions/checkout@v7
        with:
          ref: master

      # 设置 JAVA 环境
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: "21"
          cache: "gradle"

      # 设置 Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2.16.0
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          cache: true 

      # 打开 MAC Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # 更新 Flutter 的 packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 安装 appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置 Fastforge 环境（git clone github 偶发超时，带重试）
      - name: Install fast-forge
        run: |
          for i in 1 2 3; do
            if git clone https://github.com/SlotSun/fastforge.git; then break; fi
            rm -rf fastforge; sleep 15
          done
          cd fastforge
          dart pub global activate melos
          melos run activate

      # 打包 iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      # 创建未签名 ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../..

      # 上传 IPA 至 Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 打包 MAC
      - name: Build MacOS
        run: |
          cd simple_live_app
          fastforge package --platform macos --targets dmg,zip --skip-clean
      
      # 上传 MAC 至 Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip
      # 完成
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # 打包 Linux
  build-linux:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v7
        with:
          ref: master
      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: master
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev unzip libasound2-dev gcc g++ autoconf automake \
              debhelper glslang-dev ladspa-sdk xutils-dev libasound2-dev libarchive-dev libbluray-dev \
              libdav1d-dev libdvdnav-dev libegl1-mesa-dev libepoxy-dev libfontconfig-dev libfreetype6-dev \
              libfribidi-dev libgl1-mesa-dev libgbm-dev libgme-dev libgsm1-dev libharfbuzz-dev libjpeg-dev \
              libbrotli-dev liblcms2-dev libmodplug-dev libmp3lame-dev libopenal-dev \
              libopus-dev libopencore-amrnb-dev libopencore-amrwb-dev libpulse-dev librtmp-dev \
              libsdl2-dev libsixel-dev libssh-dev libsoxr-dev libspeex-dev libtool \
              libv4l-dev libva-dev libvdpau-dev libvorbis-dev libvo-amrwbenc-dev \
              libunwind-dev libvpx-dev libwayland-dev libx11-dev libxext-dev libdrm-dev \
              libxkbcommon-dev libxrandr-dev libxss-dev libxv-dev libxvidcore-dev \
              linux-libc-dev nasm ninja-build pkg-config python3 python3-docutils wayland-protocols \
              x11proto-core-dev zlib1g-dev libfdk-aac-dev libtheora-dev libwebp-dev \
              unixodbc-dev libpq-dev libxxhash-dev libaom-dev libbs2b-dev libcaca-dev libcdio-paranoia-dev
      # 打开 Linux Desktop 支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # 更新 Flutter 的 packages
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get
      # 设置 Fastforge 环境（git clone github 偶发超时，带重试）
      - name: Install fast-forge
        run: |
          for i in 1 2 3; do
            if git clone https://github.com/SlotSun/fastforge.git; then break; fi
            rm -rf fastforge; sleep 15
          done
          cd fastforge
          dart pub global activate melos
          melos run activate
      # build Linux DEB \ ZIP
      - name: Build Linux
        run: |
          cd simple_live_app
          fastforge package --platform linux --targets deb,zip --skip-clean
          cd build/dist/*
          mv simple_live_app-*-linux.deb Slive-${{ matrix.arch }}-linux.deb
          mv simple_live_app-*-linux.zip Slive-${{ matrix.arch }}-linux.zip
      # 上传 Linux 包至 Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

      # 完成
      - run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包 Windows
  build-windows:
    runs-on: windows-latest
    needs: prepare
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v7
        with:
          ref: master
      # 预装 yq（flutter-action 依赖）。
      # 2026-10-20（ISS-153）：改为**优先直下官方二进制**——chocolatey 源曾 503 抖动，
      # 直接把整条发布链拖挂（release 被跳过，只能重跑）。直下失败再回退 choco。
      - name: Install yq (direct binary first, choco fallback)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dst = Join-Path $env:RUNNER_TEMP 'yq.exe'
          $url = 'https://github.com/mikefarah/yq/releases/latest/download/yq_windows_amd64.exe'
          $ok = $false
          for ($i=1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing -TimeoutSec 120
              if ((Get-Item $dst).Length -gt 1MB) { $ok = $true; break }
            } catch { Write-Host "direct download attempt $i failed: $_" }
            Start-Sleep -Seconds 10
          }
          if ($ok) {
            $bin = Join-Path $env:USERPROFILE 'bin'
            New-Item -ItemType Directory -Force -Path $bin | Out-Null
            Copy-Item $dst (Join-Path $bin 'yq.exe') -Force
            $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host '::warning::yq 直下失败，回退 chocolatey'
            for ($i=1; $i -le 3; $i++) {
              choco install yq -y --no-progress
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 20
            }
          }
          if (-not $ok) { Write-Host '::error::yq 安装失败（直下与 choco 均失败）'; exit 1 }
          yq --version
      # 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/pubspec.yaml
          channel: stable
          cache: true
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter clean
          flutter pub get
      # 设置 Fastforge 环境 和 Inno Setup（git clone github 偶发超时，带重试）
      - name: Install fast-forge and Inno Setup
        run: |
          for ($i=1; $i -le 3; $i++) {
            git clone https://github.com/SlotSun/fastforge.git
            if ($LASTEXITCODE -eq 0) { break }
            if (Test-Path fastforge) { Remove-Item -Recurse -Force fastforge }
            Start-Sleep -Seconds 15
          }
          cd fastforge
          dart pub global activate melos
          melos run activate
          choco install innosetup
      # 添加中文安装引导
      - name: Add Chinese language file for Inno Setup
        run: |
          cd simple_live_app
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: powershell
      # build Windows ZIP\MSIX\EXE
      - name: Build Windows
        run: |
          cd simple_live_app
          fastforge package --platform windows --targets msix,zip,exe --skip-clean
          cd build/dist/*
          Get-ChildItem "simple_live_app-*" | ForEach-Object {
              $newName = $_.Name -replace '^simple_live_app', 'Slive'
              Rename-Item $_ -NewName $newName
          }
        shell: pwsh
      # 上传 Windows 至 Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
            simple_live_app/build/dist/*/*.exe
      # 完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."

  # 打包 Flatpak
  build-flatpak:
    needs: prepare
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      # 签出代码
      - uses: actions/checkout@v7
        with:
          ref: master
      # 安装依赖
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update -q
          sudo apt-get install -y flatpak flatpak-builder ca-certificates gnupg software-properties-common
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          git config --global protocol.file.allow always
      # 构建 Flatpak bundle
      - name: Build flatpak bundle
        run: |
          flatpak-builder build-dir flatpak/flatpak-manifest.yaml \
            --arch=${{ matrix.arch }} \
            --repo=${{ matrix.arch }} \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --ccache \
            --disable-rofiles-fuse
          flatpak build-bundle ${{ matrix.arch }} Slive-${{ matrix.arch }}.flatpak io.github.SlotSun.Slive

      # 上传 Flatpak 包至 Artifacts
      - name: Upload linux flatpak to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: Slive-*.flatpak

      # 完成
      - run: echo "🍏 Flatpak job's status is ${{ job.status }}."

  # 发布：把本次构建的安装包挂到 Release（tag v<版本>），并回写 app_version.json 的分平台直链
  release:
    needs: [prepare, build-android, build-mac-ios, build-linux, build-windows, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: find dist -type f | sort
      - name: Read version
        id: ver
        run: |
          V="$(sed -n 's/^version:[[:space:]]*//p' simple_live_app/pubspec.yaml | head -1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "base=${V%%+*}" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV="$(git tag --list 'v*' --sort=-v:refname | head -1 || true)"
          echo "prev tag: ${PREV:-<none>}"
          {
            echo "自建构建 ${{ steps.ver.outputs.version }}（基于上游 dev）。"
            echo
            echo "## 本次更新"
            echo
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --no-merges --pretty='- %s' | grep -v '^- chore(' || echo "- （无新增提交）"
            else
              git log --no-merges -n 20 --pretty='- %s' | grep -v '^- chore(' || echo "- （无新增提交）"
            fi
            echo
            echo "## 说明"
            echo
            echo "本 Release 为**测试版**（dev 自建构建），App 内「检查更新」会把它当作最新发行版。"
            echo "各平台安装包见下方 Assets。"
          } > release_body.md
          cat release_body.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.base }}
          name: ${{ steps.ver.outputs.base }}
          prerelease: true
          body_path: release_body.md
          files: |
            dist/**/*.apk
            dist/**/*.ipa
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.msix
            dist/**/*.exe
            dist/**/*.flatpak
            dist/**/*.zip
      # app_version.json 在 Release 建成后再写：version / version_num / desc + 分平台直链
      # （原实现由 prepare 先写，构建失败/被 cancel 时会宣告一个不存在的 Release）
      - name: Update app_version.json (after Release built)
        run: |
          set -euo pipefail
          V="$(sed -n 's/^version:[[:space:]]*//p' simple_live_app/pubspec.yaml | head -1)"
          TAG="v${V%%+*}"
          # 最近一条「非 bot(chore)」提交作为更新说明，避开上一次的 chore(version) 自引用
          DESC="$(git log --invert-grep --grep='^chore(' -n 1 --pretty=%s || true)"
          python3 - "$TAG" "$V" "$DESC" <<'PY'
          import hashlib, json, os, sys
          tag, ver, desc = sys.argv[1], sys.argv[2], sys.argv[3]
          parts = ver.split('+')[0].split('.')
          num = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2]) if len(parts) == 3 else 0
          files = [os.path.basename(os.path.join(r, f)) for r, _, fs in os.walk("dist") for f in fs]
          def pick(*preds):
              for pred in preds:
                  for n in sorted(files):
                      if pred(n):
                          return n
              return None
          urls = {}
          a = pick(lambda n: "arm64-v8a-release.apk" in n, lambda n: n.endswith("-release.apk"))
          if a:
              urls["android"] = a
          w = pick(lambda n: n.endswith("-windows-setup.exe"))
          if w:
              urls["windows"] = w
          m = pick(lambda n: n.endswith(".dmg"))
          if m:
              urls["macos"] = m
          # linux 明确取 x86_64（原实现取第一个 .deb，可能命中 aarch64）
          l = pick(lambda n: "x86_64-linux.deb" in n, lambda n: n.endswith(".deb"))
          if l:
              urls["linux"] = l
          fp = pick(lambda n: "x86_64.flatpak" in n, lambda n: n.endswith(".flatpak"))
          if fp:
              urls["linux_flatpak"] = fp
          # ios 直链是未签名 ipa（装不上）：不写直链，让其回落 releases 页
          p = "assets/app_version.json"
          d = json.load(open(p, encoding="utf-8"))
          base = "https://github.com/Howezzzzz/dart_simple_live/releases/download/" + tag + "/"
          # 2026-10-20 Howe 定：manifest 版本号 minor/patch 恒两位（与 bump/formatVersion 一致）
          _vp = ver.split('+')[0].split('.')
          d["version"] = (f"{_vp[0]}.{int(_vp[1]):02d}.{int(_vp[2]):02d}"
                           if len(_vp) == 3 else ver.split('+')[0])
          d["version_num"] = num
          d["version_desc"] = ("- " + desc) if desc else d.get("version_desc", "")
          """releases 列表页：不能用 releases/latest（GitHub 的 latest 会排除测试版，而我们发版即测试版）"""
          d["download_url"] = "https://github.com/Howezzzzz/dart_simple_live/releases"
          d["download_urls"] = {k: base + v for k, v in urls.items()}
          # 各平台产物 sha256：App 下载后校验，防第三方镜像换包（2026-10-20 Howe 定）
          def _sha_of(name):
              for r, _, fs in os.walk("dist"):
                  if name in fs:
                      h = hashlib.sha256()
                      with open(os.path.join(r, name), "rb") as fh:
                          for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                              h.update(chunk)
                      return h.hexdigest()
              return None
          hashes = {k: _sha_of(v) for k, v in urls.items()}
          missing = [k for k, h in hashes.items() if not h]
          if missing:
              print("::error::以下平台产物未能在 dist/ 找到、无法计算 sha256：" + ",".join(missing))
              sys.exit(1)
          d["download_sha256"] = hashes
          # 镜像前缀（前缀式）：App 端拿它和直链拼成候选线路，测速择优下载
          d["mirror_prefixes"] = [
              "https://gh-proxy.com/",
              "https://ghproxy.net/",
              "https://ghproxy.cc/",
          ]
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=4)
          open(p, "a", encoding="utf-8").write("\n")
          print("version:", d["version"], num, "| urls:", list(urls), "| desc:", d["version_desc"])
          PY
          NUM="${V##*+}"
          git config user.name "slive-bot"
          git config user.email "slive-bot@users.noreply.github.com"
          git add assets/app_version.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore(release): $TAG manifest [skip ci]"
            # push 竞态防护：远端 master 若已写出 >= 本次构建号的清单，跳过不覆盖（新 run 优先）
            git fetch origin master
            REMOTE_NUM="$(git show origin/master:assets/app_version.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('version_num',0))" 2>/dev/null || echo 0)"
            if [ "${REMOTE_NUM:-0}" -ge "$NUM" ]; then
              echo "远端清单已是 >= 本次（$REMOTE_NUM），跳过写入"
            else
              ok=0
              for i in 1 2 3; do
                if git pull --rebase origin master && git push origin HEAD:master; then ok=1; break; fi
                git rebase --abort 2>/dev/null || true
                sleep 5
              done
              [ "$ok" = 1 ] || echo "::warning::release manifest push 失败（并发冲突），保留远端清单"
            fi
          fi
          # 清 CDN 缓存：jsDelivr 对 @master 分支引用默认缓存最长 12h，不清则客户端会读到旧清单
          # （2026-10-20 踩过：1.8.21 已发布但客户端仍显示「已是最新」）
          # 无条件执行：含「远端已是更高版本、本次跳过写入」那条分支——那正是故障场景；清单本就是远端最新，幂等无害
          CODE=$(curl -s -o /tmp/purge.out -w '%{http_code}' --max-time 20 \
            "https://purge.jsdelivr.net/gh/Howezzzzz/dart_simple_live@master/assets/app_version.json" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "jsDelivr purge ok"
          else
            echo "::warning::jsDelivr purge 返回 $CODE（不致命，清单已发布）"
          fi
