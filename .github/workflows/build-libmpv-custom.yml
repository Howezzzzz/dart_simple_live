# 定制 libmpv 构建 —— 阶段 2/2：加滤镜并构建 libmpv（x86_64）
#
# 前置条件：阶段 1 build-libmpv-toolchain.yml 已成功（提供 clang_root / build_x86_64 缓存）。
#
# 内容：
#   1. 锁定 commit 拉取 Predidit/libmpv-win32-video-cmake 构建系统
#   2. 给 packages/ffmpeg.cmake 追加 loudnorm / dynaudnorm / speechnorm / aresample 四个原生滤镜
#      （上游 --disable-filters 后仅启用 overlay/equalizer，故动态响度滤镜全部缺失）
#   3. 构建并打包，产物改名 mpv-dev-x86_64-slive-custom.7z
#   4. 计算 SHA256 写入 Summary，并发布到 GitHub Release（tag 可指定）
#
# 构建完成后需回填 SHA256 到
#   simple_live_app/packages/media_kit/hook/native_bundles.json（native assets 架构，2026-10 起）
# 未回填前，应用构建会自动回退到上游原版 libmpv（无滤镜，音量均衡开关运行时自动置灰），不会构建失败。

name: libmpv-custom

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (asset: mpv-dev-x86_64-slive-custom.7z)'
        required: false
        default: 'libmpv-custom-v4'
        type: string

permissions:
  contents: write

concurrency:
  group: libmpv-custom
  cancel-in-progress: false

jobs:
  build_mpv:
    name: Build libmpv x86_64 (+loudnorm/dynaudnorm/speechnorm/aresample)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    env:
      CACHE_PREFIX: slive-vnorm-v1
      BUILD_REPO: Predidit/libmpv-win32-video-cmake
      BUILD_REPO_SHA: fdf75129fc694b5ca555ce73cffc43bb6943ae13  # 2026-10-22 回归修复：90278c41(tag 20260915) 比 main 旧 2 个提交、漏了 TLS 校验默认值补丁（v2 Windows 黑屏根因）→ 回钉 main HEAD
      TARGET_ARCH: x86_64-w64-mingw32
      CUSTOM_LIBMPV_NAME: mpv-dev-x86_64-slive-custom.7z
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: Checkout build system (pinned)
        uses: actions/checkout@main
        with:
          repository: ${{ env.BUILD_REPO }}
          ref: ${{ env.BUILD_REPO_SHA }}

      - name: Installing Meson
        run: |
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --upgrade --break-system-packages 'meson>=1.3.0'
          meson --version

      - name: Restore clang_root cache
        id: clang_root_cache
        uses: actions/cache/restore@main
        with:
          path: clang_root
          key: ${{ env.CACHE_PREFIX }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-clang_root

      - name: Restore repository cache
        id: repo_cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ env.CACHE_PREFIX }}-repository-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-repository

      - name: Restore x86_64 toolchain cache
        id: toolchain_cache
        uses: actions/cache/restore@main
        with:
          path: build_x86_64
          key: ${{ env.CACHE_PREFIX }}-clang-x86_64_toolchain-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-clang-x86_64_toolchain

      - name: Verify toolchain cache present
        run: |
          if [[ -z "${{ steps.clang_root_cache.outputs.cache-matched-key }}" || -z "${{ steps.toolchain_cache.outputs.cache-matched-key }}" ]]; then
            echo "::error::Toolchain cache missing. Run workflow 'libmpv-toolchain' (stage 1/2) first."
            exit 1
          fi

      # 清掉缓存里可能残留的旧 mpv 产物（否则 find/打包会撞到旧 libmpv-2.dll / 多个 7z）
      - name: Clean stale mpv artifacts from cache
        run: |
          rm -rf build_x86_64/mpv-dev-* build_x86_64/mpv-debug-* build_x86_64/mpv-x86_64-* build_x86_64/mpv-*.7z
          echo "top-level build_x86_64:"
          ls -1 build_x86_64 | head -50 || true

      - name: Patch ffmpeg.cmake (enable loudnorm/dynaudnorm/speechnorm)
        run: |
          python3 - <<'PY'
          import sys
          path = "packages/ffmpeg.cmake"
          anchor = "        --enable-filter=equalizer\n"
          add = (
              "        --enable-filter=loudnorm\n"
              "        --enable-filter=dynaudnorm\n"
              "        --enable-filter=speechnorm\n"
              "        --enable-filter=aresample\n"
          )
          with open(path, encoding="utf-8") as f:
              src = f.read()
          count = src.count(anchor)
          if count != 1:
              sys.exit(f"ERROR: anchor not unique in {path} (found {count}); aborting to avoid mis-patch")
          with open(path, "w", encoding="utf-8") as f:
              f.write(src.replace(anchor, anchor + add, 1))
          print("patched", path)
          PY
          echo "--- filter lines after patch ---"
          grep -n -- '--enable-filter' packages/ffmpeg.cmake
          for filt in loudnorm dynaudnorm speechnorm aresample; do
            grep -qxF "        --enable-filter=${filt}" packages/ffmpeg.cmake || { echo "::error::patch verification failed: ${filt}"; exit 1; }
          done

      # 2026-11-10：若干上游包用浮动分支（GIT_TAG main）自带补丁，上游前进后补丁上下文失配 → 包的 patch 步骤红。
      # 已触发：fontconfig（gitlab，git am --3way 因 tree:0 替身克隆取不到基线 blob）、libvpl（github，git apply 硬失败）。
      # 修法：把这些包的源码钉到最后一次成功构建(2026-10-22)前的已知good提交，并遵守本构建系统约定——
      #       钉 commit hash 时必须删掉 GIT_REMOTE_NAME，否则 force-update 会对 detached HEAD 跑 git reset --hard @{u} → fatal。
      # 本地均已用真身源码逐一验证：补丁在这些提交上 git apply --check 干净通过，且在各自当前上游 main 上失败。
      - name: Pin drifting patched sources (fontconfig/libvpl)
        run: |
          python3 - <<'PY'
          import sys
          PINS = {
              "packages/fontconfig.cmake": "b25ffeabd15b76f86c0c6736f6df2f1b89858010",  # fontconfig main @2026-10-21
              "packages/libvpl.cmake":     "674d015bcb294bc39fa276e99a652ea045423e82",  # intel/libvpl main @2026-07-13
          }
          for path, sha in PINS.items():
              src = open(path, encoding="utf-8").read()
              a1 = "GIT_TAG main\n"
              if src.count(a1) != 1:
                  sys.exit(f"ERROR: GIT_TAG main not unique/missing in {path} (found {src.count(a1)})")
              src = src.replace(a1, f"GIT_TAG {sha}\n", 1)
              a2 = "    GIT_REMOTE_NAME origin\n"
              if src.count(a2) != 1:
                  sys.exit(f"ERROR: GIT_REMOTE_NAME origin not unique/missing in {path} (found {src.count(a2)})")
              src = src.replace(a2, "", 1)
              open(path, "w", encoding="utf-8").write(src)
              print("pinned", path, "->", sha)
          PY
          grep -qF "GIT_TAG b25ffeabd15b76f86c0c6736f6df2f1b89858010" packages/fontconfig.cmake || { echo "::error::fontconfig pin verify failed"; exit 1; }
          grep -qF "GIT_TAG 674d015bcb294bc39fa276e99a652ea045423e82" packages/libvpl.cmake || { echo "::error::libvpl pin verify failed"; exit 1; }
          if grep -qF "GIT_REMOTE_NAME" packages/fontconfig.cmake packages/libvpl.cmake; then echo "::error::GIT_REMOTE_NAME still present"; exit 1; fi
          grep -n "GIT_TAG" packages/fontconfig.cmake packages/libvpl.cmake
          # 清掉缓存里可能残留的源码，强制按新钉的 SHA 重新 clone
          rm -rf src_packages/fontconfig src_packages/libvpl

      # 2026-10-22：上游 libopenmpt 0.7.12 的 tarball 链接失效（lib.openmpt.org 疑撤旧版）→
      # 按序探测可用源（0.7.12 原链 / 0.7.13 / buildroot 镜像），取第一个可用者，并同步 URL_HASH。
      - name: Fix libopenmpt source URL (原 0.7.12 链失效，探测可用源)
        run: |
          set -e
          F=packages/libopenmpt.cmake
          try_src() { # $1=url  $2=sha256(大写)
            code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 -L --max-time 60 "$1" || echo 000)
            echo "probe [$code] $1"
            case "$code" in
              200|206)
                sed -i "s|https://lib\.openmpt\.org/files/libopenmpt/src/[^[:space:]]*|$1|" "$F"
                sed -i "s|SHA256=[0-9A-Fa-f]*|SHA256=$2|" "$F"
                echo "-> applied: $1"
                grep -nE 'URL' "$F"
                return 0 ;;
              *) return 1 ;;
            esac
          }
          # 实测（2026-10-22 runner）：lib.openmpt.org 整站不可达（curl 000）；buildroot 镜像 206 可下。
          try_src "https://sources.buildroot.net/libopenmpt/libopenmpt-0.7.13+release.autotools.tar.gz" "DCD7CDE4F9C498EB496C4556E1C1B81353E2A74747E8270A42565117EA42E1F1" \
          || try_src "https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.7.13+release.autotools.tar.gz" "DCD7CDE4F9C498EB496C4556E1C1B81353E2A74747E8270A42565117EA42E1F1" \
          || try_src "https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.7.12+release.autotools.tar.gz" "79AB3CE3672601E525B5CC944F026C80C03032F37D39CAA84C8CA3FDD75E0C98" \
          || { echo "::error::no usable libopenmpt source found (0.7.12/0.7.13/mirrors all unreachable)"; exit 1; }

      - name: Configure & download sources
        run: |
          cmake -DTARGET_ARCH=${TARGET_ARCH} -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/${TARGET_ARCH} -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja --fresh -B build_x86_64 -S $PWD
          if [[ -z "${{ steps.repo_cache.outputs.cache-matched-key }}" || ! -e src_packages/opus/.git ]]; then
            find build_x86_64/packages -path "*/src/*-stamp/*-download" -delete || true
          fi
          ninja -C build_x86_64 download

      - name: Build mpv
        run: |
          ninja -C build_x86_64 update
          ninja -C build_x86_64 mpv

      # 用 Python 字节匹配（CI 容器的 strings 实测对 PE 匹配不可靠，曾把好产物误判）。
      # 取最大的 libmpv-2.dll（真身），并带对照项与候选清单。
      - name: Verify filters present in built libmpv-2.dll (防静默降级)
        run: |
          python3 - <<'PY'
          import glob, os, sys
          cands = sorted(glob.glob("build_x86_64/**/libmpv-2.dll", recursive=True), key=os.path.getsize, reverse=True)
          print("candidates (size, path):", [(os.path.getsize(p), p) for p in cands])
          if not cands:
              print("::error::libmpv-2.dll not found in build tree"); sys.exit(1)
          dll = cands[0]
          data = open(dll, "rb").read()
          print(f"checking {dll} ({len(data)} bytes)")
          for c in ("overlay", "equalizer", "FFmpeg"):
              print(f"control {'OK' if c.encode() in data else 'MISSING'}: {c}")
          miss = [f for f in ("loudnorm", "dynaudnorm", "speechnorm", "aresample") if f.encode() not in data]
          if miss:
              print(f"::error::filters missing in {dll}: {miss}"); sys.exit(1)
          print("OK: loudnorm/dynaudnorm/speechnorm/aresample all present")
          PY

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p release_x86_64
          ninja -C build_x86_64 mpv-packaging
          shopt -s nullglob
          artifacts=(build_x86_64/mpv-dev-x86_64*.7z)
          if ((${#artifacts[@]} != 1)); then
            echo "::error::expected exactly one mpv-dev-x86_64 archive, found ${#artifacts[@]}: ${artifacts[*]}"
            exit 1
          fi
          mv "${artifacts[0]}" "release_x86_64/${CUSTOM_LIBMPV_NAME}"
          ls -la release_x86_64

      - name: Compute SHA256 & write summary
        run: |
          sha=$(sha256sum "release_x86_64/${CUSTOM_LIBMPV_NAME}" | awk '{print $1}')
          echo "CUSTOM_LIBMPV_SHA256=$sha" >> "$GITHUB_ENV"
          {
            echo "## Custom libmpv (stage 2/2) built"
            echo
            echo "- Asset: \`${CUSTOM_LIBMPV_NAME}\`"
            echo "- Release tag: \`${{ inputs.release_tag }}\`"
            echo "- Base: \`${BUILD_REPO}@${BUILD_REPO_SHA}\` + loudnorm/dynaudnorm/speechnorm"
            echo "- **SHA256**: \`${sha}\`"
            echo
            echo "Backfill into \`simple_live_app/packages/media_kit_libs_windows_video/windows/CMakeLists.txt\` -> \`LIBMPV_SHA256\` (x86_64 branch)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: mpv-x86_64-dev-custom
          path: release_x86_64/${{ env.CUSTOM_LIBMPV_NAME }}
          retention-days: 7

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error


          def main():
              repo = os.environ["GITHUB_REPOSITORY"]
              token = os.environ["GH_TOKEN"]
              tag = os.environ["TAG"]
              name = os.environ["CUSTOM_LIBMPV_NAME"]
              sha = os.environ["CUSTOM_LIBMPV_SHA256"]
              run_id = os.environ["GITHUB_RUN_ID"]
              api_base = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              base = api_base + "/repos/" + repo

              def req(method, url, data=None, ctype="application/json"):
                  body = None
                  if data is not None:
                      body = data if isinstance(data, bytes) else json.dumps(data).encode()
                  r = urllib.request.Request(url, data=body, method=method)
                  r.add_header("Accept", "application/vnd.github+json")
                  r.add_header("Authorization", "Bearer " + token)
                  if data is not None:
                      r.add_header("Content-Type", ctype)
                  try:
                      with urllib.request.urlopen(r) as resp:
                          raw = resp.read().decode()
                          return resp.status, (json.loads(raw) if raw else {})
                  except urllib.error.HTTPError as e:
                      raw = e.read().decode()
                      try:
                          return e.code, json.loads(raw)
                      except Exception:
                          return e.code, {"raw": raw}

              body = (
                  "Custom libmpv x86_64 with loudnorm/dynaudnorm/speechnorm filters enabled.\n\n"
                  "Base: Predidit/libmpv-win32-video-cmake (pinned commit) + filter patch.\n"
                  "SHA256: " + sha + "\n"
                  "Workflow run: https://github.com/" + repo + "/actions/runs/" + run_id + "\n"
              )
              code, rel = req("POST", base + "/releases",
                              {"tag_name": tag, "name": tag, "body": body, "draft": False})
              if code not in (200, 201):
                  print("create release failed, fallback to existing tag:", code, rel)
                  code, rel = req("GET", base + "/releases/tags/" + tag)
              if code not in (200, 201) or "upload_url" not in rel:
                  raise RuntimeError("cannot create/find release " + tag + ": " + json.dumps(rel)[:500])
              upload_url = rel["upload_url"].split("{")[0]
              for a in rel.get("assets", []):
                  if a.get("name") == name:
                      print("deleting existing asset", a["id"])
                      req("DELETE", base + "/releases/assets/" + str(a["id"]))
              with open(os.path.join("release_x86_64", name), "rb") as f:
                  data = f.read()
              code, res = req("POST", upload_url + "?name=" + name, data, "application/x-7z-compressed")
              if code not in (200, 201):
                  raise RuntimeError("asset upload failed: " + json.dumps(res)[:500])
              print("Release published: https://github.com/" + repo + "/releases/tag/" + tag)


          if __name__ == "__main__":
              try:
                  main()
              except SystemExit:
                  raise
              except Exception as e:
                  sys.exit("ERROR: release publishing failed for tag "
                           + os.environ.get("TAG", "?")
                           + " in " + os.environ.get("GITHUB_REPOSITORY", "?")
                           + ": " + type(e).__name__ + ": " + str(e))
          PY
