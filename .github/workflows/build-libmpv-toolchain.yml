# 定制 libmpv 构建 —— 阶段 1/2：clang 交叉工具链（x86_64）
#
# 依据 Predidit/libmpv-win32-video-cmake 的构建系统（锁定 commit），但关闭 PGO/LTO 以缩短冷启动耗时，
# 并只构建 x86_64 一种架构（上游默认矩阵含 i686/x86_64_v3/aarch64，本项目不需要）。
#
# 产物：Actions 缓存（clang_root / build_x86_64 / src_packages），供阶段 2 build-libmpv-custom.yml 复用。
# 使用：Actions 页面手动 Run workflow（stage 1 成功后再跑 stage 2，两步都需要）。
#
# 说明：本文件为自写流程封装（上游 workflow 依赖自身 secrets 与跨仓触发，不适用），
# 仅以「调用上游公开构建系统」的方式使用其构建脚本，未拷贝其工作流本体。

name: libmpv-toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libmpv-toolchain
  cancel-in-progress: false

jobs:
  build_toolchain:
    name: Build clang toolchain (x86_64, no PGO/LTO)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    env:
      CACHE_PREFIX: slive-vnorm-v1
      BUILD_REPO: Predidit/libmpv-win32-video-cmake
      BUILD_REPO_SHA: fdf75129fc694b5ca555ce73cffc43bb6943ae13
      TARGET_ARCH: x86_64-w64-mingw32
    steps:
      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: Checkout build system (pinned)
        uses: actions/checkout@main
        with:
          repository: ${{ env.BUILD_REPO }}
          ref: ${{ env.BUILD_REPO_SHA }}

      - name: Installing Meson
        run: |
          python -m pip --version || pacman -Sy --needed --noconfirm python-pip
          python -m pip install --upgrade --break-system-packages 'meson>=1.3.0'
          meson --version

      - name: Restore clang_root cache
        id: clang_root_cache
        uses: actions/cache/restore@main
        with:
          path: clang_root
          key: ${{ env.CACHE_PREFIX }}-clang_root-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-clang_root

      - name: Restore x86_64 toolchain cache
        id: toolchain_cache
        uses: actions/cache/restore@main
        with:
          path: build_x86_64
          key: ${{ env.CACHE_PREFIX }}-clang-x86_64_toolchain-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-clang-x86_64_toolchain

      - name: Restore repository cache
        id: repo_cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ env.CACHE_PREFIX }}-repository-${{ github.run_id }}
          restore-keys: ${{ env.CACHE_PREFIX }}-repository

      - name: Building LLVM (plain, no PGO)
        if: ${{ steps.clang_root_cache.outputs.cache-matched-key == '' }}
        run: |
          cmake -DTARGET_ARCH=${TARGET_ARCH} -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/${TARGET_ARCH} -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm
          ninja -C build_x86_64 rustup
          ninja -C build_x86_64 cargo-clean

      - name: Building x86_64 toolchain
        if: ${{ steps.toolchain_cache.outputs.cache-matched-key == '' }}
        run: |
          cmake -DTARGET_ARCH=${TARGET_ARCH} -DCOMPILER_TOOLCHAIN=clang -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_x86_64/${TARGET_ARCH} -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -G Ninja -B build_x86_64 -S $PWD
          ninja -C build_x86_64 llvm-clang

      - name: Saving clang root
        if: ${{ steps.clang_root_cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@main
        with:
          path: clang_root
          key: ${{ env.CACHE_PREFIX }}-clang_root-${{ github.run_id }}

      - name: Saving x86_64 toolchain
        if: ${{ steps.toolchain_cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@main
        with:
          path: build_x86_64
          key: ${{ env.CACHE_PREFIX }}-clang-x86_64_toolchain-${{ github.run_id }}

      - name: Saving repository cache
        if: ${{ success() && steps.repo_cache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@main
        with:
          path: src_packages
          key: ${{ env.CACHE_PREFIX }}-repository-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## libmpv toolchain (stage 1/2)"
            echo "- clang_root cache: \`${{ steps.clang_root_cache.outputs.cache-matched-key || 'MISS -> built' }}\`"
            echo "- x86_64 toolchain cache: \`${{ steps.toolchain_cache.outputs.cache-matched-key || 'MISS -> built' }}\`"
            echo "- repository cache: \`${{ steps.repo_cache.outputs.cache-matched-key || 'MISS -> built' }}\`"
            echo
            echo "Stage 1 done. Now run **libmpv-custom** (stage 2/2) from the Actions tab."
          } >> "$GITHUB_STEP_SUMMARY"
